name: Build Mac App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --name="AppBone" \
                    --windowed \
                    --onefile \
                    appbone.py
    
    - name: Create DMG
      run: |
        mkdir -p dist/dmg
        cp -r "dist/AppBone.app" dist/dmg/
        hdiutil create -volname "AppBone" -srcfolder dist/dmg -ov -format UDZO dist/AppBone.dmg
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: AppBone-macOS
        path: |
          dist/AppBone.dmg
          dist/AppBone.app
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/AppBone.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
